version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:17-alpine
    container_name: giapha_postgres
    restart: always
    environment:
      POSTGRES_DB: giaphaviet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d giaphaviet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - giapha_network

  # 2. Spring Boot 3 Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: giapha_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/giaphaviet
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
    ports:
      - "8080:8080"
    networks:
      - giapha_network

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: giapha_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - giapha_network

volumes:
  postgres_data:

networks:
  giapha_network:
    driver: bridge
